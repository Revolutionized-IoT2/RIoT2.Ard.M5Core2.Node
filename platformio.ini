; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++14
	-DMQTT_MAX_PACKET_SIZE=512
	; See RIoT2.Ard.M5Dial.Node/platformio.ini for why this is raised from
	; PubSubClient's 15s default.
	-DMQTT_KEEPALIVE=60
	-D'RIOT2_DEFAULT_NODE_NAME="M5Core2 Node"'
	-DLV_CONF_INCLUDE_SIMPLE
	; PlatformIO only auto-adds include/ as a search path for this project's
	; own src/*.cpp - library sources (e.g. lvgl's own font/*.c) only see
	; build_flags-provided -I paths, so lv_conf.h must be added here too or
	; LV_CONF_INCLUDE_SIMPLE silently finds nothing and every LV_* setting in
	; lv_conf.h is ignored (falls back to lv_conf_internal.h's defaults) for
	; any lvgl source file - not just the ones needing LV_FONT_MONTSERRAT_24.
	-Iinclude
	; Optional first-boot defaults, seeded into NVS (Preferences) if no NodeConfig
	; is stored yet. Uncomment and fill in to test connectivity without the
	; provisioning portal:
	; -D'DEFAULT_NODE_ID="98D067AB-9672-45D1-81DF-110B4B82455D"'
	; -D'DEFAULT_NODE_NAME="M5Core2 Node"'
	; -D'DEFAULT_WIFI_SSID="your-ssid"'
	; -D'DEFAULT_WIFI_PASSWORD="your-password"'
	; -D'DEFAULT_MQTT_SERVER_URL="192.168.1.10:1883"'
	; -D'DEFAULT_MQTT_USERNAME=""'
	; -D'DEFAULT_MQTT_PASSWORD=""'
board_build.filesystem = littlefs
monitor_speed = 115200
lib_extra_dirs = ../RIoT2.Ard.Shared
extra_scripts = pre:../RIoT2.Ard.Shared/scripts/generate_manifest.py
lib_deps =
	m5stack/M5Unified@^0.2.18
	lvgl/lvgl@^9.2.2
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.1.0
	h2zero/NimBLE-Arduino@^2.2.1
